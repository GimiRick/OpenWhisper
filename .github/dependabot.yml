version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "openwhisper-maintainers"
    assignees:
      - "openwhisper-maintainers"
    labels:
      - "dependencies"
      - "npm"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
